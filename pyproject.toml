[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tijnobader-dimcheck"
version = "0.1.0"
description = "读取向量元数据，检测维度、归一化方式与模型版本是否混用"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tijnobader" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tijnobader.github.io"
Repository = "https://github.com/tijnobader/dimcheck"
Issues = "https://github.com/tijnobader/dimcheck/issues"

[project.scripts]
dimcheck = "dimcheck:main"

[tool.setuptools]
py-modules = ["dimcheck"]
